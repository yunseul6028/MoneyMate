<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mm-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6c5ce7"/>
      <stop offset="1" stop-color="#a29bfe"/>
    </linearGradient>
    <linearGradient id="mm-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 배경: 브랜드 보라 그라데이션 -->
  <rect width="512" height="512" rx="115" fill="url(#mm-bg)"/>
  <rect width="512" height="512" rx="115" fill="url(#mm-shine)"/>

  <!-- MoneyMate 'M' 모노그램 -->
  <path d="M168 366 L168 156 L256 298 L344 156 L344 366"
        fill="none" stroke="#ffffff" stroke-width="46"
