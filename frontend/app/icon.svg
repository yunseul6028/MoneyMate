  <!-- 날개 달린 동전 (💸 느낌) -->
  <circle cx="384" cy="140" r="34" fill="#ffd76a"/>
  <circle cx="384" cy="140" r="34" fill="none" stroke="#f0b429" stroke-width="4"/>
